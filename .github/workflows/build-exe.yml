name: Build CleanRemoto.exe

# Compila o programa em UM UNICO arquivo (CleanRemoto.exe) num runner Windows
# e publica numa Release, para o site baixar o arquivo unico (estilo AnyDesk).

on:
  push:
    branches: ["**"]
    paths:
      - "cleanremoto.py"
      - "requirements.txt"
      - ".github/workflows/build-exe.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      # Embute o endereco da ponte no .exe, se a variavel do repositorio
      # CLEANREMOTO_RELAY estiver definida (Settings -> Secrets and variables
      # -> Actions -> Variables). Assim o usuario final NAO precisa configurar
      # nada: abre, ve o codigo e ja conecta.
      - name: Embutir endereco da ponte (se configurado)
        shell: bash
        env:
          RELAY_URL: ${{ vars.CLEANREMOTO_RELAY }}
        run: |
          if [ -n "$RELAY_URL" ]; then
            python - <<'PY'
import os, re
url = os.environ["RELAY_URL"].strip()
s = open("cleanremoto.py", encoding="utf-8").read()
s2 = re.sub(r'^RELAY_PADRAO = ""', 'RELAY_PADRAO = %r' % url, s, count=1, flags=re.M)
open("cleanremoto.py", "w", encoding="utf-8").write(s2)
print("Ponte embutida no .exe:", url)
PY
          else
            echo "Variavel CLEANREMOTO_RELAY nao definida; .exe sem ponte embutida."
          fi

      - name: Gerar o executavel unico
        run: >
          pyinstaller --noconfirm --onefile --windowed --name CleanRemoto
          --collect-all pynput --collect-all mss --collect-all websockets
          cleanremoto.py

      - name: Publicar como artefato do build
        uses: actions/upload-artifact@v4
        with:
          name: CleanRemoto-exe
          path: dist/CleanRemoto.exe

      - name: Publicar na Release "app" (download estavel para o site)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app
          name: Clean Remoto (ultima versao)
          body: |
            Arquivo unico **CleanRemoto.exe** — baixe, de dois cliques e pronto.
            Nao precisa instalar Python. Atualizado automaticamente a cada build.
          files: dist/CleanRemoto.exe
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Comita o .exe no repositorio para a Vercel servir publicamente em
      # /CleanRemoto.exe (funciona mesmo com o repositorio privado, pois a
      # Vercel serve os arquivos do deploy de forma publica).
      - name: Publicar o .exe no site (commit para a Vercel servir)
        shell: bash
        run: |
          cp dist/CleanRemoto.exe CleanRemoto.exe
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f CleanRemoto.exe
          if git diff --cached --quiet; then
            echo "Sem mudancas no .exe"; exit 0
          fi
          git commit -m "Atualiza CleanRemoto.exe para download no site"
          git push origin "HEAD:${GITHUB_REF_NAME}"
